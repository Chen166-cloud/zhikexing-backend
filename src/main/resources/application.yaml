spring:
  application:
    name: intelligent-integrated-interaction-platform

  ai:
    model:
      chat: deepseek

    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    deepseek:
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        options:
          model: deepseek-v4-pro

    openai:
      # 阿里云百炼兼容 OpenAI 接口
      # Spring AI 默认会追加 /v1/chat/completions，所以这里保持到 compatible-mode 即可
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      api-key: ${API-KEY}

      chat:
        options:
          model: qwen3.7-max

      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024

    vectorstore:
      type: custom
      redis:
        initialize-schema: true
        index-name: iiip-pdf-index
        prefix: "iiip:pdf:"

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/spring-ai-demo?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 1234

  data:
    redis:
      host: localhost
      port: 6379
      client-type: jedis

  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 40MB

logging:
  level:
    org.springframework.ai: debug
    com.chy.ai: debug
