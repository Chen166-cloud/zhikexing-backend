spring:
  application:
    name: zhikexing-backend
  task:
    scheduling:
      pool:
        size: 3
  ai:
    model:
      chat: openai
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    openai:
      # Spring AI 2 使用官方 SDK，base-url 必须包含兼容接口的 /v1。
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:${API-KEY:}}
      chat:
        model: ${AGENT_CHAT_MODEL:qwen3.7-flash}
      embedding:
        model: text-embedding-v4
        dimensions: 1024
    vectorstore:
      type: custom
      redis:
        initialize-schema: false
        index-name: zhikexing-pdf-secure-index
        prefix: 'zhikexing:pdf:secure:'
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhikexing?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      client-type: jedis
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 40MB
  mvc:
    async:
      request-timeout: 310000
server:
  port: ${SERVER_PORT:8080}
app:
  trial:
    recovery-batch-size: ${TRIAL_RECOVERY_BATCH_SIZE:30}
    recovery-delay-ms: ${TRIAL_RECOVERY_DELAY_MS:1000}
  catalog-cache:
    mode: ${APP_CATALOG_CACHE_MODE:two-level}
    key-prefix: ${APP_CATALOG_CACHE_KEY_PREFIX:catalog:}
    local-ttl: ${CATALOG_LOCAL_TTL:10s}
    shared-ttl: ${CATALOG_SHARED_TTL:60s}
    max-entries: ${CATALOG_MAX_ENTRIES:1000}
    lock-wait: ${CATALOG_LOCK_WAIT:1s}
  auth:
    global-attempts: ${AUTH_GLOBAL_ATTEMPTS:20}
    global-window-seconds: ${AUTH_GLOBAL_WINDOW_SECONDS:1}
    account-attempts: ${AUTH_ACCOUNT_ATTEMPTS:10}
    account-window-seconds: ${AUTH_ACCOUNT_WINDOW_SECONDS:60}
    max-concurrent: ${AUTH_MAX_CONCURRENT:4}
    failure-threshold: ${AUTH_FAILURE_THRESHOLD:5}
    failure-window-seconds: ${AUTH_FAILURE_WINDOW_SECONDS:600}
    cooldown-seconds: ${AUTH_COOLDOWN_SECONDS:60}
    max-sessions: ${AUTH_MAX_SESSIONS:3}
  ids:
    # Assign a distinct value to every running Java instance (0-1022); 1023 is reserved for migrations.
    node-id: ${SNOWFLAKE_NODE_ID:0}
  legacy-ai-enabled: ${LEGACY_AI_ENABLED:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5176,http://127.0.0.1:5176,http://localhost:8088,http://127.0.0.1:8088}
  agent:
    runtime-url: ${AGENT_RUNTIME_URL:http://127.0.0.1:8000}
    internal-token: ${AGENT_INTERNAL_TOKEN:}
    rocketmq-enabled: ${ROCKETMQ_ENABLED:false}
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}
    bucketName: ${OSS_BUCKET:}
    region: ${OSS_REGION:cn-shanghai}
logging:
  level:
    org.springframework.ai: WARN
    com.chy.zhikexing: INFO
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
rocketmq:
  name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
  agent:
    topic: zhikexing-agent-commands
    producer-group: zhikexing-agent-command-producer
    consumer-group: zhikexing-agent-command-consumer
