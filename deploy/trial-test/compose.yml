# Isolated disposable verification environment; no application volumes or credentials.
name: zhikexing-trial-test
services:
  mysql:
    image: mysql:8.4.8
    environment:
      MYSQL_ROOT_PASSWORD: trial-test-only
      MYSQL_DATABASE: zhikexing_trial_test
    ports: ["127.0.0.1:23306:3306"]
    tmpfs: [/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "MYSQL_PWD=trial-test-only mysql -uroot -e 'SELECT 1'"]
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:8.2.1-alpine
    command: [redis-server, --appendonly, "no", --maxmemory-policy, noeviction]
    ports: ["127.0.0.1:26379:6379"]
  nameserver:
    image: apache/rocketmq:5.5.0
    environment: {JAVA_OPT_EXT: "-Xms128m -Xmx128m -Xmn64m"}
    command: sh mqnamesrv
    ports: ["127.0.0.1:19876:9876"]
  broker:
    image: apache/rocketmq:5.5.0
    depends_on: [nameserver]
    environment: {JAVA_OPT_EXT: "-Xms256m -Xmx256m -Xmn128m"}
    command: sh mqbroker -c /home/rocketmq/broker.conf
    ports: ["127.0.0.1:20911:20911", "127.0.0.1:20909:20909"]
    volumes: ["./broker.conf:/home/rocketmq/broker.conf:ro"]
