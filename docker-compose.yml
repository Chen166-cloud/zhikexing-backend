name: zhikexing

# 默认启动核心数据服务；observability 增加完整观测依赖，app 增加应用。
x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/langfuse
  NEXTAUTH_URL: ${LANGFUSE_PUBLIC_URL:-http://localhost:13000}
  NEXTAUTH_SECRET: ${LANGFUSE_AUTH_SECRET}
  SALT: ${LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
  TELEMETRY_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "true"
  LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
  LANGFUSE_S3_BATCH_EXPORT_REGION: us-east-1
  LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
  LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: ${S3_PUBLIC_URL:-http://localhost:19000}
  LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/

x-langfuse-dependencies: &langfuse-dependencies
  langfuse-postgres: {condition: service_healthy}
  langfuse-redis: {condition: service_healthy}
  clickhouse: {condition: service_healthy}
  minio: {condition: service_healthy}
  minio-init: {condition: service_completed_successfully}

services:
  mysql:
    image: mysql:8.4.8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: zhikexing
      MYSQL_USER: zhikexing
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports: ["127.0.0.1:${MYSQL_PORT:-13306}:3306"]
    volumes: ["mysql-data:/var/lib/mysql"]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql -h 127.0.0.1 -uzhikexing zhikexing -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: pgvector/pgvector:0.8.5-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: zhikexing_agent
      POSTGRES_USER: zhikexing
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/001-vector.sql:/docker-entrypoint-initdb.d/001-vector.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zhikexing -d zhikexing_agent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:8.2.1-alpine
    restart: unless-stopped
    environment: {REDIS_PASSWORD: "${REDIS_PASSWORD}"}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    ports: ["127.0.0.1:${REDIS_PORT:-16379}:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  rocketmq-nameserver:
    image: apache/rocketmq:5.5.0@sha256:7e8f6c9dbd9df742ed26ba69c00d4ad69e2f86a56f3ca7782ff8144dd0798132
    restart: unless-stopped
    command: [sh, mqnamesrv]
    environment:
      JAVA_OPT_EXT: -Xms128m -Xmx256m -Xmn64m
    ports: ["127.0.0.1:${ROCKETMQ_NAMESERVER_PORT:-9876}:9876"]
    healthcheck:
      test: [CMD-SHELL, "bash -c ': >/dev/tcp/127.0.0.1/9876'"]
      interval: 10s
      timeout: 5s
      retries: 20

  rocketmq-volume-init:
    image: apache/rocketmq:5.5.0@sha256:7e8f6c9dbd9df742ed26ba69c00d4ad69e2f86a56f3ca7782ff8144dd0798132
    user: "0:0"
    entrypoint: [sh, -ec, "chown -R 3000:3000 /home/rocketmq/store /home/rocketmq/logs"]
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-logs:/home/rocketmq/logs

  rocketmq-broker:
    image: apache/rocketmq:5.5.0@sha256:7e8f6c9dbd9df742ed26ba69c00d4ad69e2f86a56f3ca7782ff8144dd0798132
    hostname: rocketmq-broker
    restart: unless-stopped
    depends_on:
      rocketmq-nameserver: {condition: service_healthy}
      rocketmq-volume-init: {condition: service_completed_successfully}
    environment:
      NAMESRV_ADDR: rocketmq-nameserver:9876
      JAVA_OPT_EXT: -Xms256m -Xmx512m -Xmn128m
      BROKER_ADVERTISED_HOST: ${ROCKETMQ_BROKER_HOST:-rocketmq-broker}
    command:
      - sh
      - -c
      - >-
        cp /etc/rocketmq/broker.conf /tmp/zhikexing-broker.conf &&
        printf '\nbrokerIP1=%s\n' "$$BROKER_ADVERTISED_HOST" >> /tmp/zhikexing-broker.conf &&
        exec sh mqbroker -c /tmp/zhikexing-broker.conf
    ports: ["127.0.0.1:10911:10911", "127.0.0.1:10909:10909"]
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-logs:/home/rocketmq/logs
      - ./deploy/rocketmq/broker.conf:/etc/rocketmq/broker.conf:ro
    healthcheck:
      test: [CMD-SHELL, "sh mqadmin brokerStatus -n rocketmq-nameserver:9876 -b 127.0.0.1:10911 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  rocketmq-init:
    image: apache/rocketmq:5.5.0@sha256:7e8f6c9dbd9df742ed26ba69c00d4ad69e2f86a56f3ca7782ff8144dd0798132
    depends_on:
      rocketmq-broker: {condition: service_healthy}
    entrypoint: [sh, /etc/rocketmq/init-topics.sh]
    volumes:
      - ./deploy/rocketmq/init-topics.sh:/etc/rocketmq/init-topics.sh:ro

  minio:
    image: cgr.dev/chainguard/minio@sha256:e7728e37a015dcd2f2b146abc4aedc0096769ac72cb64cc9ed36b7f4183361e1
    restart: unless-stopped
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    ports:
      - "127.0.0.1:${S3_PORT:-19000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-19001}:9001"
    volumes: ["minio-data:/data"]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:e7728e37a015dcd2f2b146abc4aedc0096769ac72cb64cc9ed36b7f4183361e1
    depends_on:
      minio: {condition: service_healthy}
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    entrypoint: [/bin/sh, -c]
    command:
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" >/dev/null
        mc mb --ignore-existing local/zhikexing-documents local/langfuse

  langfuse-postgres:
    image: postgres:17.10-alpine
    profiles: [observability]
    restart: unless-stopped
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
    volumes: ["langfuse-postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 20

  langfuse-redis:
    image: redis:8.2.1-alpine
    profiles: [observability]
    restart: unless-stopped
    environment: {REDIS_PASSWORD: "${LANGFUSE_REDIS_PASSWORD}"}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD" --maxmemory-policy noeviction']
    volumes: ["langfuse-redis-data:/data"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    profiles: [observability]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: [CMD-SHELL, "wget --quiet --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.38.0
    profiles: [observability]
    restart: unless-stopped
    depends_on: *langfuse-dependencies
    environment: *langfuse-env

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.38.0
    profiles: [observability]
    restart: unless-stopped
    depends_on: *langfuse-dependencies
    environment:
      <<: *langfuse-env
      HOSTNAME: 0.0.0.0
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: ${S3_PUBLIC_URL:-http://localhost:19000}
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: zhikexing
      LANGFUSE_INIT_ORG_NAME: 知课行
      LANGFUSE_INIT_PROJECT_ID: zhikexing-agent
      LANGFUSE_INIT_PROJECT_NAME: 知课行 Agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:-admin@zhikexing.local}
      LANGFUSE_INIT_USER_NAME: 知课行 Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
    ports: ["127.0.0.1:${LANGFUSE_PORT:-13000}:3000"]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/public/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    profiles: [observability]
    restart: unless-stopped
    command: [--config=/etc/otelcol/config.yaml]
    volumes: ["./deploy/otel-collector.yaml:/etc/otelcol/config.yaml:ro"]
    ports:
      - "127.0.0.1:14317:4317"
      - "127.0.0.1:14318:4318"
      - "127.0.0.1:13133:13133"

  prometheus:
    image: prom/prometheus:v3.14.0
    profiles: [observability]
    restart: unless-stopped
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=15d]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:13.2.2
    profiles: [observability]
    restart: unless-stopped
    depends_on:
      prometheus: {condition: service_healthy}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:${GRAFANA_PORT:-13001}:3000"]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build: .
    profiles: [app]
    restart: unless-stopped
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      rocketmq-init: {condition: service_completed_successfully}
    environment:
      DB_URL: jdbc:mysql://mysql:3306/zhikexing?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: zhikexing
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ROCKETMQ_ENABLED: ${ROCKETMQ_ENABLED:-true}
      SNOWFLAKE_NODE_ID: ${SNOWFLAKE_NODE_ID:-0}
      AUTH_GLOBAL_ATTEMPTS: ${AUTH_GLOBAL_ATTEMPTS:-20}
      AUTH_GLOBAL_WINDOW_SECONDS: ${AUTH_GLOBAL_WINDOW_SECONDS:-1}
      AUTH_ACCOUNT_ATTEMPTS: ${AUTH_ACCOUNT_ATTEMPTS:-10}
      AUTH_ACCOUNT_WINDOW_SECONDS: ${AUTH_ACCOUNT_WINDOW_SECONDS:-60}
      AUTH_MAX_CONCURRENT: ${AUTH_MAX_CONCURRENT:-4}
      AUTH_FAILURE_THRESHOLD: ${AUTH_FAILURE_THRESHOLD:-5}
      AUTH_FAILURE_WINDOW_SECONDS: ${AUTH_FAILURE_WINDOW_SECONDS:-600}
      AUTH_COOLDOWN_SECONDS: ${AUTH_COOLDOWN_SECONDS:-60}
      AUTH_MAX_SESSIONS: ${AUTH_MAX_SESSIONS:-3}
      CATALOG_LOCAL_TTL: ${CATALOG_LOCAL_TTL:-10s}
      CATALOG_SHARED_TTL: ${CATALOG_SHARED_TTL:-60s}
      CATALOG_MAX_ENTRIES: ${CATALOG_MAX_ENTRIES:-1000}
      CATALOG_LOCK_WAIT: ${CATALOG_LOCK_WAIT:-1s}
      ROCKETMQ_NAME_SERVER: rocketmq-nameserver:9876
      AGENT_RUNTIME_URL: http://agent-runtime:8000
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AGENT_CHAT_MODEL: qwen3.7-flash
      LEGACY_AI_ENABLED: "false"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:5176,http://127.0.0.1:5176,http://localhost:8088,http://127.0.0.1:8088}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -Dfile.encoding=UTF-8
    ports: ["127.0.0.1:${BACKEND_PORT:-18080}:8080"]
    healthcheck:
      test: [CMD, curl, -fsS, "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30

  agent-runtime:
    image: ${AGENT_RUNTIME_IMAGE:-zhikexing-agent-runtime:latest}
    build: ${AGENT_RUNTIME_PATH:-../zhikexing-agent-runtime}
    profiles: [app]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    environment:
      AGENT_DATABASE_URL: postgresql+psycopg://zhikexing:${POSTGRES_PASSWORD}@postgres:5432/zhikexing_agent
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN}
      JAVA_TOOL_BASE_URL: http://backend:8080
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-bailian}
      AI_CHAT_MODEL: qwen3.7-flash
      AI_EMBEDDING_MODEL: text-embedding-v4
      AI_EMBEDDING_DIMENSIONS: "1024"
      AGENT_COST_LIMIT_CNY: ${AGENT_COST_LIMIT_CNY:-0.10}
      AGENT_TOKEN_LIMIT: ${AGENT_TOKEN_LIMIT:-40000}
      AGENT_RUN_TIMEOUT_SECONDS: ${AGENT_RUN_TIMEOUT_SECONDS:-240}
      AGENT_MAX_PARALLEL: ${AGENT_MAX_PARALLEL:-4}
      STORAGE_ROOT: /data
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_BUCKET: zhikexing-documents
      LANGFUSE_BASE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes: ["agent-data:/data"]
    ports: ["127.0.0.1:${AGENT_RUNTIME_PORT:-18000}:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ${FRONTEND_PATH:-../zhikexing-web}
      dockerfile_inline: |
        FROM node:22.18.0-alpine AS build
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci
        COPY . .
        RUN npm run build
        FROM nginx:1.28.0-alpine
        COPY --from=build /app/dist /usr/share/nginx/html
    profiles: [app]
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      agent-runtime: {condition: service_healthy}
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:${FRONTEND_PORT:-8088}:80"]
    healthcheck:
      test: [CMD, wget, --quiet, --spider, "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  postgres-data:
  redis-data:
  rocketmq-store:
  rocketmq-logs:
  minio-data:
  langfuse-postgres-data:
  langfuse-redis-data:
  clickhouse-data:
  clickhouse-logs:
  prometheus-data:
  grafana-data:
  agent-data:
