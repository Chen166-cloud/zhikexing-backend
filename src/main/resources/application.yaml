spring:
  application:
    name: intelligent-integrated-interaction-platform
  ai:
    model:
      chat: openai
    chat:
      memory:
        repository:
          jdbc:
            initialize-schema: never
    openai:
      # Spring AI 2 使用官方 SDK，base-url 必须包含兼容接口的 /v1。
      base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${DASHSCOPE_API_KEY:${API-KEY:}}
      chat:
        model: ${AGENT_CHAT_MODEL:qwen3.7-flash}
      embedding:
        model: text-embedding-v4
        dimensions: 1024
    vectorstore:
      type: custom
      redis:
        initialize-schema: false
        index-name: iiip-pdf-secure-index
        prefix: 'iiip:pdf:secure:'
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://localhost:3306/iiip_agent?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:iiip}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:iiip}
    connection-timeout: 5s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      client-type: jedis
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 40MB
  mvc:
    async:
      request-timeout: 310000
server:
  port: ${SERVER_PORT:8080}
app:
  legacy-ai-enabled: ${LEGACY_AI_ENABLED:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5176,http://127.0.0.1:5176,http://localhost:8088,http://127.0.0.1:8088}
  agent:
    runtime-url: ${AGENT_RUNTIME_URL:http://127.0.0.1:8000}
    internal-token: ${AGENT_INTERNAL_TOKEN:}
    rabbitmq-enabled: ${RABBITMQ_ENABLED:false}
    publisher-confirm-timeout: 10s
aliyun:
  oss:
    endpoint: ${OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}
    bucketName: ${OSS_BUCKET:}
    region: ${OSS_REGION:cn-shanghai}
logging:
  level:
    org.springframework.ai: WARN
    com.chy.ai: INFO
management:
  health:
    rabbit:
      enabled: ${RABBITMQ_ENABLED:false}
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
